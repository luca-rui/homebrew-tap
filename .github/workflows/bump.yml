name: bump

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dependencies:
        description: Also take new dependency releases when rga-ocr itself has not moved
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  formula:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bump/formula
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rewrite the formula from PyPI
        id: update
        env:
          MODE: ${{ inputs.dependencies && ' ' || '--new-release' }}
        run: |
          python3 -I scripts/update_formula.py $MODE | tee "$RUNNER_TEMP/update.txt"
          if git diff --quiet -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(sed -n 's/^rga-ocr \([^:]*\):.*/\1/p' "$RUNNER_TEMP/update.txt")" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch and open the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          if git rev-parse -q --verify "origin/$BRANCH" >/dev/null \
              && git diff --quiet "origin/$BRANCH" -- Formula; then
            echo "The open branch already carries this formula."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "Update the rga-ocr formula from PyPI (rga-ocr $VERSION)" -- Formula
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Update the rga-ocr formula from PyPI (rga-ocr $VERSION)" \
              --body "Written by \`scripts/update_formula.py\` from the newest wheels on PyPI. The diff shows which packages moved."
          fi
          # A pull request opened with GITHUB_TOKEN does not start workflows,
          # so the test run is started by hand on the branch.
          gh workflow run test.yml --ref "$BRANCH"
