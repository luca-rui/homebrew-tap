name: test

on:
  pull_request:
  push:
    branches: [main]
  # The formula has no bottles and its Homebrew dependencies are not
  # pinned, so an install can break without a change in this repository.
  schedule:
    - cron: "43 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    name: script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the update script
        run: python3 -I tests/test_update_formula.py

  formula:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use this checkout as the tap
        run: |
          taps="$(brew --repository)/Library/Taps/luca-rui"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"

      - name: Install
        id: install
        run: brew install --build-from-source luca-rui/tap/rga-ocr

      # The checks below each run when the install worked, so one run shows
      # every failure.
      - name: Linkage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: brew linkage --test rga-ocr

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: brew test luca-rui/tap/rga-ocr

      - name: Dependencies fit together
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$(brew --prefix python@3.14)/bin/python3.14" -m pip \
            --python "$(brew --prefix rga-ocr)/libexec/bin/python" check

      - name: Search a scanned image and a scanned PDF
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail    # a failure left of a pipe fails the step
          work="$RUNNER_TEMP/search"
          mkdir -p "$work/docs"
          "$(brew --prefix rga-ocr)/libexec/bin/python" - "$work/docs/scan.png" "$work/docs/scan.pdf" <<'PY'
          import sys
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new("RGB", (1400, 300), "white")
          font = ImageFont.load_default(size=96)
          ImageDraw.Draw(img).text((60, 80), "quarterly zebra invoice", fill="black", font=font)
          img.save(sys.argv[1])
          img.save(sys.argv[2])
          PY
          export RGA_OCR_CACHE_DIR="$work/cache"

          # A fresh install searches without setup --apply.
          rga-ocr zebra "$work/docs" | tee "$work/plain.txt"
          grep -q "scan.png" "$work/plain.txt"
          grep -q "scan.pdf" "$work/plain.txt"

          # setup --apply still writes a path that survives brew upgrade.
          rm -rf "$work/cache"
          rga-ocr --rga-config-file="$work/rga.jsonc" setup --apply
          grep -q "/opt/rga-ocr/libexec/bin/python" "$work/rga.jsonc"
          if grep -q "Cellar" "$work/rga.jsonc"; then
            echo "setup wrote a Cellar path, which breaks on brew upgrade"
            exit 1
          fi
          rga-ocr --rga-config-file="$work/rga.jsonc" zebra "$work/docs" | tee "$work/out.txt"
          grep -q "scan.png" "$work/out.txt"
          grep -q "scan.pdf" "$work/out.txt"

      - name: Audit
        if: always()
        run: brew audit --strict luca-rui/tap/rga-ocr

  # The commit status `formula-tests` is the one result a ruleset on main
  # can require, rather than the jobs above. A status belongs to a commit,
  # so the run that `bump` starts by hand on its branch counts for the pull
  # request of that branch; the jobs of such a run are not rolled up there.
  # A pull request from a fork has a read-only token and gets no status
  # from its own run.
  status:
    name: status
    needs: [script, formula]
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the result on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          # The head of the pull request, not the merge commit the run built.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ needs.script.result == 'success' && needs.formula.result == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" \
            -f context=formula-tests \
            -f description="test workflow, started by $GITHUB_EVENT_NAME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
